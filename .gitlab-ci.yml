stages:
  - deploy

deploy_logaiops:
  stage: deploy
  image: ubuntu:22.04
  script:
    - apt-get update -y
    - apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - export SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15"
    - ssh -v $SSH_OPTS hadoop@47.76.135.8 "echo 连接成功"

