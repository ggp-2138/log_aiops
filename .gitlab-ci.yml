stages:
  - deploy

deploy_logaiops:
  stage: deploy
  image: ubuntu:22.04
  script:
    - apt-get update -y
    - apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    # 从普通环境变量把私钥写入文件，不使用GitLab文件变量，规避清理阶段bug
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # 跳过主机密钥检查，省去ssh‑keyscan步骤
    - export SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=10"
    - ssh $SSH_OPTS hadoop@47.76.135.8 "echo ✅ 远程连接成功"
    # 正式部署打开下面注释

