name: test_stl_mad

# 触发时机：push推送代码、提交pull‑request时自动运行
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted 
        
    steps:
      # 拉取仓库代码
      - name: pull code
        uses: actions/checkout@v4

      # 配置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv
      
      # 代码格式检查
      - name: Python代码格式校验
        run: black --check . --exclude "(venv|__pycache__|docker)"

      # STL‑MAD 单元测试
      - name: 运行 STL‑MAD 全套单元测试
        run: pytest tests/test_stl_mad.py -v

      # 5. 远程一键无缝部署（CD 环节）
      - name: Remote Zero-Downtime Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 7001
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          debug: true
          script: |
            # 1. 判断 test_cicd 目录是否存在，不存在则首次克隆
            PROJECT_ROOT="/home/hadoop/log_cicd"
            [ ! -d "${PROJECT_ROOT}" ] && git clone https://github.com/${{ github.repository }}.git "${PROJECT_ROOT}"

            # 2. 更新仓库
            cd "${PROJECT_ROOT}"
            git fetch origin
            git reset --hard origin/main
            
            # 3. 拉取镜像 + 无缝重启
            # --remove-orphans 生产环境禁用

            # 检查公共网桥
            docker network ls | grep -w monitoring || docker network create monitoring

            # 启动 ELK 容器服务
            cd docker/compose_log
            docker compose -p compose_log up -d --pull always --remove‑orphans

            #启动 Prometheus +各 exporter 容器服务
            cd ../compose_prome
            docker compose -p compose_prome up -d --pull always --remove‑orphans

            # 4. 检查服务状态
            docker ps -a
            echo "✅ CI/CD 自动化部署完成"